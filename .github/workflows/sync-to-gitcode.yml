name: Sync Release to GitCode

on:
 workflow_dispatch:
 release:
 types: [published]

jobs:
 sync:
 runs-on: ubuntu-latest
 steps:
 - name: Checkout
 uses: actions/checkout@v4

 - name: Create GitCode Release
 id: create_release
 env:
 GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
 run: |
 TAG_NAME="${{ github.event.release.tag_name }}"
 RELEASE_NAME="${{ github.event.release.name }}"
 BODY='${{ github.event.release.body }}'

 # Escape for JSON
 BODY=$(python3 -c "
import sys, json, os
body = os.environ.get('BODY', '')
body = body.replace('\\', '\\\\').replace('\"', '\\\"').replace('\n', '\\n')
print(body)
")

 echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
 echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT

 RESPONSE=$(curl -s -X POST \
 "https://api.gitcode.com/api/v5/repos/SCPfoundation/AVT_subtitle_processor/releases" \
 -H "Content-Type: application/json" \
 -H "Token: ${GITCODE_TOKEN}" \
 -d "$(python3 -c "
import json
print(json.dumps({
 'tag_name': '''$TAG_NAME''',
 'name': '''$RELEASE_NAME''',
 'body': '''$BODY'''
}))
")" \
 --max-time 30 \
 -w "\nHTTP_CODE:%{http_code}")

 echo "$RESPONSE"
 HTTP_CODE=$(echo "$RESPONSE" | tail -1 | cut -d: -f2)
 if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
 echo "Failed to create release, HTTP code: $HTTP_CODE"
 echo "$RESPONSE"
 exit 1
 fi

 - name: Download GitHub Release Assets
 if: always()
 run: |
 mkdir -p assets
 python3 << 'PYEOF'
import os, json, urllib.request, urllib.parse

assets = json.loads('''${{ toJson(github.event.release.assets) }}''')
tag_name = '''${{ github.event.release.tag_name }}'''
os.makedirs('assets', exist_ok=True)

for asset in assets:
 name = asset['name']
 url = asset['browser_download_url']
 dest = os.path.join('assets', name)
 print(f"Downloading {name} from {url}")
 urllib.request.urlretrieve(url, dest)
 print(f"Saved: {dest} ({os.path.getsize(dest)} bytes)")

print(f"Total assets downloaded: {len(assets)}")
PYEOF

 - name: Upload Assets to GitCode
 if: always()
 env:
 GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
 TAG_NAME: ${{ github.event.release.tag_name }}
 run: |
 python3 << 'PYEOF'
import os, glob, urllib.request, json

gitcode_token = os.environ.get('GITCODE_TOKEN')
tag_name = os.environ.get('TAG_NAME')
owner = 'SCPfoundation'
repo = 'AVT_subtitle_processor'

# Get release info
req = urllib.request.Request(
 f"https://api.gitcode.com/api/v5/repos/{owner}/{repo}/releases/tags/{tag_name}",
 headers={"Token": gitcode_token, "User-Agent": "curl/7.68.0"}
)
with urllib.request.urlopen(req, timeout=15) as resp:
 release_info = json.loads(resp.read())
 release_id = release_info.get('id')
 print(f"Release ID: {release_id}")
 print(f"Release URL: {release_info.get('html_url', 'N/A')}")

# Upload assets
import requests

files_to_upload = glob.glob('assets/*')
print(f"Files to upload: {files_to_upload}")

for fpath in files_to_upload:
 fname = os.path.basename(fpath)
 upload_url = f"https://api.gitcode.com/api/v5/repos/{owner}/{repo}/releases/{release_id}/assets?name={urllib.parse.quote(fname)}"
 print(f"Uploading {fname} to {upload_url}")
 
 with open(fpath, 'rb') as f:
 req_u = urllib.request.Request(
 upload_url,
 data=f.read(),
 headers={
 "Token": gitcode_token,
 "Content-Type": "application/octet-stream",
 "User-Agent": "curl/7.68.0"
 },
 method='POST'
 )
 try:
 with urllib.request.urlopen(req_u, timeout=60) as resp_u:
 print(f"Uploaded: {fname} -> {resp_u.read().decode()}")
 except Exception as e:
 print(f"Failed to upload {fname}: {e}")

print("Upload complete")
PYEOF

 - name: Summary
 if: always()
 run: |
 echo "## GitCode Release Sync Summary" >> $GITHUB_STEP_SUMMARY
 echo "" >> $GITHUB_STEP_SUMMARY
 echo "**Tag:** ${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
 echo "**Name:** ${{ github.event.release.name }}" >> $GITHUB_STEP_SUMMARY
 echo "**GitHub Release:** ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
 echo "" >> $GITHUB_STEP_SUMMARY
 echo "**GitCode Release:** https://gitcode.com/SCPfoundation/AVT_subtitle_processor/releases/tag/${{ github.event.release.tag_name }}" >> $GITHUB_STEP_SUMMARY
 echo "**Assets synced:** ${{ github.event.release.assets_count }}" >> $GITHUB_STEP_SUMMARY
